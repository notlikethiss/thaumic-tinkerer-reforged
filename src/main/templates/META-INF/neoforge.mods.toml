modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
bannerFile="TTLogo.png"
iconFile="icon.png"
authors="${mod_authors}"
credits="${mod_credits}"
enumExtensions="META-INF/enumextensions.json"
description='''
Addon for Thaumcraft 4: Reforged. Unofficial port of Thaumic Tinkerer 2.5.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="thaumcraft"
    type="required"
    versionRange="[${thaumcraft_version},)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
